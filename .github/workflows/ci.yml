name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Before typecheck: packages resolve each other through the built `dist/*.d.mts`.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Reuse Node 22's build and dependencies; these check CLI runtime compatibility only.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: node scripts/smoke-runtime.mjs
        timeout-minutes: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - run: node scripts/smoke-runtime.mjs
        timeout-minutes: 1
